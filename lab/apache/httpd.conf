ServerRoot "/usr/local/apache2"
Listen 8080
ServerName vectra-apache-lab.invalid
PidFile /tmp/vectra-httpd.pid
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule alias_module modules/mod_alias.so
LoadModule log_config_module modules/mod_log_config.so
User daemon
Group daemon
ServerTokens Full
ServerSignature Off
TraceEnable Off
Timeout 10
KeepAlive Off
StartServers 1
ServerLimit 2
ThreadLimit 8
ThreadsPerChild 4
MinSpareThreads 2
MaxSpareThreads 6
MaxRequestWorkers 8
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%{%Y-%m-%dT%H:%M:%S%z}t|%a|%{remote}p|%m|%r|%>s|%B|%{X-Vectra-Lab-Asset}i|%{X-Vectra-Observed-Peer}i|%{X-Vectra-Request-ID}i" vectra
CustomLog /proc/self/fd/1 vectra
DocumentRoot "/srv/lab/public"
<Directory "/">
    AllowOverride None
    Require all denied
</Directory>
<Directory "/srv/lab">
    AllowOverride None
    Options None
    Require all granted
    ForceType text/plain
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
</Directory>
Alias "/documents/" "/srv/lab/public/"
# No CGI, proxy or executable handlers are loaded. Only this dummy tree is readable via HTTP.
