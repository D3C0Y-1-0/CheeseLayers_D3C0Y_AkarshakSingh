worker_processes 1;
pid /tmp/nginx.pid;
error_log /proc/self/fd/2 warn;
events { worker_connections 64; }
http {
    access_log /proc/self/fd/1;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    server {
        listen 8081;
        location / {
            # No URI suffix: preserve the original request target to the lab Apache instance.
            proxy_pass http://vulnerable:8080;
            proxy_set_header Host vectra-apache-lab.invalid;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Vectra-Lab-Asset LAB-APACHE-VULN;
            proxy_set_header X-Vectra-Observed-Peer $remote_addr;
            proxy_set_header X-Vectra-Request-ID $request_id;
            add_header X-Vectra-Request-ID $request_id always;
        }
    }
    server {
        listen 8082;
        location / {
            proxy_pass http://patched:8080;
            proxy_set_header Host vectra-apache-lab.invalid;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Vectra-Lab-Asset LAB-APACHE-PATCHED;
            proxy_set_header X-Vectra-Observed-Peer $remote_addr;
            proxy_set_header X-Vectra-Request-ID $request_id;
            add_header X-Vectra-Request-ID $request_id always;
        }
    }
}
